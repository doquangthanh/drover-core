[project]
name = "drover"
version = "0.2.22"
description = "Personal workspace for running coding agents: persistent sessions, status detection, multi-machine"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "aiohttp>=3.10",
    "pyte>=0.8.2",
    "platformdirs>=4.2",
    "asyncssh>=2.17",
    "desktop-notifier>=6.0",
    "pywinpty>=2.0.13; sys_platform == 'win32'",
    "ptyprocess>=0.7; sys_platform != 'win32'",
    "claude-agent-sdk>=0.2.182",
]

[project.scripts]
dr = "drover.cli.cli_main:main"
hd = "drover.cli.cli_main:main"  # old name from before the rename to Drover; agents and scripts may still call it

[project.optional-dependencies]
tui = [
    "textual>=0.80",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/drover/web_dist/**"]  # gitignored Vite build output

[tool.hatch.build.targets.wheel]
packages = ["src/drover"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
