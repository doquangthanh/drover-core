[package]
name = "drover-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"  # killpg for a cancelled check step (checks/runner.rs); already in the lock through tokio

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
drover-core = { version = "0.2.2", path = "../drover-core" }
futures-util = "0.3.34"
getrandom = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
mime_guess = "2.0.5"
regex = "1.13.1"
sha2 = "0.10.9"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
shlex = "2.0.1"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time", "sync", "signal", "process", "fs"] }
toml = "1.2.1"
