[package]
name = "drover-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dr"
path = "src/main.rs"

# `server`: `dr server run` hosts the Rust daemon (Linux bundle). Off on Windows, where dr.exe is only the fast
# front door for agent commands (`cargo build -p drover-cli --no-default-features`) and Python serves the rest.
[features]
default = ["server"]
server = ["dep:drover-daemon"]

[dependencies]
base64 = "0.23.1"
drover-daemon = { version = "0.2.2", path = "../drover-daemon", optional = true }
# float_roundtrip: exact float parsing, so `created_at` prints back with Python's digits (default parser is lossy)
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }

# Windows state dir is %LOCALAPPDATA%\drover: no `dirs` (its windows-sys needs dlltool on the GNU toolchain).
[target.'cfg(not(windows))'.dependencies]
dirs = "7.0.0"
