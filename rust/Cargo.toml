[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Crate metadata only. The release version lives in pyproject.toml (read by drover-daemon/build.rs).
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"

# Small, fast binaries: the whole point of the rewrite is low RAM and quick startup.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
# portable-pty 0.9.0 creates ConPTY with INHERIT_CURSOR: conhost then waits for a cursor-position reply that a
# headless pane never sends, so Windows panes showed nothing and never exited. Same flags minus that one.
portable-pty = { path = "vendor/portable-pty-0.9.0" }
