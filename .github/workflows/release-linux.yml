name: release-linux

# Builds the core part of the Linux bundle when a tag like v0.1.0 is pushed: Rust `dr` (fast CLI + daemon) + Python `dr-py`
# (rest of the CLI + TUI). Attached to the release as drover-core-linux-<arch>.tar.gz (+ SHA-256).
# assemble-bundle.yml adds the web UI, the Tauri window and the GPUI window and publishes drover-linux-<arch>.tar.gz.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04 }        # old glibc: the binaries run on most distros
          - { arch: arm64, runner: ubuntu-24.04-arm }  # PyQt6-Qt6 aarch64 wheels (resolved by uv sync) need glibc >= 2.39
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: "pyproject.toml must already hold the tag's version (same guard as Windows; stops a half release)"
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml || { echo "set version in pyproject.toml to ${GITHUB_REF_NAME#v} before tagging" >&2; exit 1; }
      - name: System libraries for the Tauri window (WebKitGTK 4.1) and the native GPUI window (preview)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig1-dev libfreetype-dev libvulkan-dev
      - name: Rust toolchain (rust/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: rust
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"${GITHUB_REF_NAME#v}\"/" src/drover/__init__.py
          sed -i "0,/^version = .*/s//version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml  # read by the Rust build
      - name: Build Python dr
        run: |
          uv sync --extra tui  # bundle Textual so plain `dr` opens the terminal UI
          uv run pyinstaller packaging/drover.spec --noconfirm
      - name: Build the Rust dr (fast CLI + daemon)
        run: cargo build --release --locked -p drover-cli
        working-directory: rust
      - name: Assemble bundle
        run: |
          install -m 755 rust/target/release/dr dist/drover/dr  # Rust fast CLI + daemon; the Python CLI is dr-py
          install -m 755 rust/target/release/dr dist/drover/drover-server  # old daemon name: updaters from <= 0.1.42 check it
          ln -s dr dist/drover/hd  # old CLI name, kept so agents and scripts that call `hd` still work
      - name: "Smoke test (Rust dr, Python dr-py, Rust daemon: same checks as Windows)"
        run: |
          export DROVER_STATE_DIR="$(mktemp -d)" DROVER_CONFIG_DIR="$(mktemp -d)"
          dist/drover/dr-py --help >/dev/null
          dist/drover/dr --help >/dev/null  # delegated to dr-py
          test -z "$(dist/drover/dr ls --names)"  # fast path, no daemon: prints nothing, exit 0
          dist/drover/dr server start
          dist/drover/dr status
          grep -q '"engine": *"rust"' <(curl -fsS -H "Authorization: Bearer $(jq -r .token "$DROVER_STATE_DIR/daemon.json")" \
            -d '{"method":"server.info","params":{}}' "http://127.0.0.1:$(jq -r .port "$DROVER_STATE_DIR/daemon.json")/rpc")
          curl -sS -o /dev/null "http://127.0.0.1:$(jq -r .port "$DROVER_STATE_DIR/daemon.json")/health"  # the web UI is added by assemble-bundle.yml
          dist/drover/dr ls
          dist/drover/dr server stop
      - name: Package
        run: |
          tar -czf drover-core-linux-${{ matrix.arch }}.tar.gz -C dist drover
          sha256sum drover-core-linux-${{ matrix.arch }}.tar.gz > drover-core-linux-${{ matrix.arch }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: drover-core-linux-${{ matrix.arch }}
          path: drover-core-linux-${{ matrix.arch }}.tar.gz*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}  # v1.2.3-rc.1: test build, not offered as an update
          files: |
            drover-core-linux-${{ matrix.arch }}.tar.gz
            drover-core-linux-${{ matrix.arch }}.tar.gz.sha256
